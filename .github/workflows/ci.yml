name: Test and container smoke
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-production.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-production.txt "pytest>=8,<10"
      - run: python scripts/build_vision.py
      - run: python -m pytest -q
      - run: node --test tests/*.test.mjs
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag contour:ci .
      - name: Start public-mode service
        run: docker run -d --name contour-ci -p 127.0.0.1:8000:8000 --memory=2g --cpus=2 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m -e CONTOUR_ALLOWED_HOSTS=contour.example contour:ci
      - name: Check public health, keys, CPU components, UI and host policy
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /tmp/health.json; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json,urllib.request,urllib.error
          data=json.load(open('/tmp/health.json'))
          assert data['ok'] and data['public_mode'] and data['processing_location']=='server'
          assert not data['server_key'] and not data['local_key_storage']
          request=urllib.request.Request('http://127.0.0.1:8000/api/health',headers={'Host':'contour.example','Origin':'https://contour.example'})
          assert urllib.request.urlopen(request).status==200
          request=urllib.request.Request('http://127.0.0.1:8000/api/health',headers={'Host':'evil.example'})
          try: urllib.request.urlopen(request)
          except urllib.error.HTTPError as error: assert error.code==403
          else: raise AssertionError('Unknown host was accepted')
          assert urllib.request.urlopen('http://127.0.0.1:8000/').status==200
          assert urllib.request.urlopen('http://127.0.0.1:8000/api/timelines/catalog').status==200
          PY
          docker exec contour-ci python -c "import numpy as np; from backend.cimg_native import components; a=np.zeros((16,16),np.uint8);a[4:8,4:8]=255; result=components(a,dict(connectivity='8',min_pixels=1,max_pixels=100,reject_border=True)); assert result[2]==1"
          test "$(docker inspect --format '{{.Config.User}}' contour-ci)" = contour
      - name: Container logs
        if: always()
        run: docker logs contour-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f contour-ci || true
